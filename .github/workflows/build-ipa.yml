name: Build Film Space iPhone app

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build for iPhone without a distribution certificate
        run: |
          xcodebuild \
            -project "film space.xcodeproj" \
            -scheme "film space" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$RUNNER_TEMP/film-space-build" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Test scene editing and persistence on iPhone simulator
        run: |
          device=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(v["udid"] for group in d["devices"].values() for v in group if v["name"].startswith("iPhone")))')
          xcodebuild -project "film space.xcodeproj" -scheme "film space" -destination "platform=iOS Simulator,id=$device" -only-testing:film_spaceTests CODE_SIGNING_ALLOWED=NO test

      - name: Package unsigned IPA for personal sideloading
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/film-space-build/Build/Products/Release-iphoneos/film space.app"
          test -d "$app"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          ditto "$app" "$RUNNER_TEMP/ipa/Payload/film space.app"
          cd "$RUNNER_TEMP/ipa"
          zip -qry "$RUNNER_TEMP/FilmSpace-unsigned.ipa" Payload

      - name: Upload iPhone app
        uses: actions/upload-artifact@v4
        with:
          name: FilmSpace-unsigned-IPA
          path: ${{ runner.temp }}/FilmSpace-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
